services:
  mysql:
    image: mysql:8.0.36
    container_name: litchi-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-litchi_platform}
      MYSQL_USER: ${MYSQL_USER:-litchi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-litchi123456}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

  neo4j:
    image: neo4j:5.15-community
    container_name: litchi-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/litchi123456}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-1G}
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_INIT:-1G}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2G}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${SPRING_NEO4J_PASSWORD:-litchi123456}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: litchi-etcd
    command:
      - etcd
      - --data-dir=/etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=default=http://etcd:2380
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: litchi-minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: litchi-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G

  ollama:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/ollama/ollama:0.5.7
    container_name: litchi-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          memory: 2G

  ollama-model-init:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/ollama/ollama:0.5.7
    container_name: litchi-ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:0.5b}
    entrypoint:
      - /bin/sh
      - -lc
      - 'until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$$OLLAMA_CHAT_MODEL" || true'
    networks:
      - litchi-network
    restart: "no"

  diagnosis-service:
    build:
      context: ./diagnosis-service
      dockerfile: Dockerfile
    container_name: litchi-diagnosis
    environment:
      DIAGNOSIS_HOST: 0.0.0.0
      DIAGNOSIS_PORT: 8090
      DIAGNOSIS_MODEL_PATH: ${DIAGNOSIS_MODEL_PATH:-/models/yolov8-litchi.pt}
      DIAGNOSIS_STRICT_MODEL: ${DIAGNOSIS_STRICT_MODEL:-false}
    ports:
      - "8090:8090"
    volumes:
      - ./models:/models
      - ./datasets:/app/datasets
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litchi-backend
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
      diagnosis-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${SPRING_NEO4J_USERNAME:-neo4j}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${SPRING_NEO4J_PASSWORD:-litchi123456}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:0.5b}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-ollama}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-litchi_knowledge}
      APP_DOCUMENT_STORAGE_DIR: /app/data/documents
      APP_DOCUMENT_STATE_FILE: /app/data/document-state.json
      APP_DIAGNOSIS_SERVICE_URL: http://diagnosis-service:8090/predict
      APP_MYSQL_ENABLED: ${APP_MYSQL_ENABLED:-true}
      APP_MYSQL_URL: ${APP_MYSQL_URL:-jdbc:mysql://mysql:3306/litchi_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      APP_MYSQL_USERNAME: ${APP_MYSQL_USERNAME:-litchi}
      APP_MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-litchi123456}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
      APP_STARTUP_AUTO_BOOTSTRAP: ${APP_STARTUP_AUTO_BOOTSTRAP:-true}
      APP_STARTUP_MAX_ATTEMPTS: ${APP_STARTUP_MAX_ATTEMPTS:-12}
      APP_STARTUP_RETRY_DELAY_MS: ${APP_STARTUP_RETRY_DELAY_MS:-5000}
      APP_LLM_TIMEOUT_MS: ${APP_LLM_TIMEOUT_MS:-60000}
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    networks:
      - litchi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: litchi-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8081:80"
    networks:
      - litchi-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
  backend_data:

networks:
  litchi-network:
    driver: bridge
