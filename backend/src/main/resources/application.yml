spring:
  application:
    name: litchi-qa-platform
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  file:
    name: logs/application.log
  level:
    com.litchi: DEBUG
    org.springframework.ai: DEBUG

app:
  retrieval:
    strategy: ${APP_RETRIEVAL_STRATEGY:hybrid}
  agent:
    max-steps: ${APP_AGENT_MAX_STEPS:4}
  resilience:
    dependency-retry-delay-ms: ${APP_DEPENDENCY_RETRY_DELAY_MS:300000}
  llm:
    provider: ${APP_LLM_PROVIDER:ollama}
    base-url: ${APP_LLM_BASE_URL:}
    api-key: ${APP_LLM_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:litchi-qa-platform}
