apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litchi.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "litchi.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "litchi.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "litchi.name" . }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.springProfilesActive | quote }}
            - name: SPRING_AI_OLLAMA_BASE_URL
              value: {{ .Values.env.llmBaseUrl | quote }}
            - name: SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL
              value: {{ .Values.env.llmModel | quote }}
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
