replicaCount: 2
image:
  repository: ghcr.io/example/litchi-backend
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8080
  type: ClusterIP
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: false
  className: nginx
  host: litchi.example.com
  tls: false
env:
  springProfilesActive: prod
  llmBaseUrl: http://vllm:8000
  llmModel: Qwen/Qwen2.5-3B-Instruct-AWQ
